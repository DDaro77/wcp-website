<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Brief form</title>
    <style>
      .bot-field {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <form
      name="brief"
      method="POST"
      action="/netlify-form.html"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="brief" />
      <p class="bot-field">
        <label>
          Do not fill this out
          <input name="bot-field" tabindex="-1" autocomplete="off" />
        </label>
      </p>
      <label>
        Name
        <input type="text" name="name" />
      </label>
      <label>
        Email
        <input type="email" name="email" />
      </label>
      <label>
        Project type
        <input type="text" name="type" />
      </label>
      <label>
        Location
        <input type="text" name="location" />
      </label>
      <label>
        The brief
        <textarea name="message"></textarea>
      </label>
      <button type="submit">Send brief</button>
    </form>
  </body>
</html>
